name: Build Android app

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

env:
  KS_PASS: ${{ secrets.ANDROID_KEY_PASSWORD }}
  KS_PATH: ${{ github.workspace }}/release.jks
  VCODE: ${{ github.run_number }}
  VNAME: 1.0.${{ github.run_number }}

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      # Ads (F3b, A-D8): real ads are a checkpoint. The build fails if the launch switch in src/js/ads.js is on,
      # unless the repository variable ADS_LIVE is set to yes on purpose (Settings > Secrets and variables > Actions > Variables).
      - name: Ads launch switch guard
        env:
          ADS_LIVE: ${{ vars.ADS_LIVE }}
        run: |
          sh scripts/check-ads-switch.sh
          # the ads unit tests too: an edit inside ads.js that hands out the real unit while the switch is off fails here
          node --test tests/ads.test.js

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Use the Android SDK already on the runner
        run: |
          echo "ANDROID_HOME=$ANDROID_SDK_ROOT" >> $GITHUB_ENV
          yes | "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true

      - name: Install Capacitor
        run: |
          npm install
          # G2c (G-D18): the back button library is pinned. Fail if npm installed anything but exactly @capacitor/app 8.1.2.
          V=$(node -p "require('./node_modules/@capacitor/app/package.json').version" 2>/dev/null || true)
          echo "@capacitor/app $V"
          [ "$V" = "8.1.2" ] || { echo "::error::@capacitor/app must be exactly 8.1.2 (found '$V')"; exit 1; }
          # D2 (DP-D10): the reminder and rating plugins are pinned too. Fail on anything but exactly these versions.
          for P in '@capacitor/local-notifications 8.3.1' '@capacitor-community/in-app-review 8.0.0'; do
            N=${P% *}; W=${P#* }
            V=$(node -p "require('./node_modules/$N/package.json').version" 2>/dev/null || true)
            echo "$N $V"
            [ "$V" = "$W" ] || { echo "::error::$N must be exactly $W (found '$V')"; exit 1; }
          done

      - name: Create the Android project
        run: |
          npx cap add android
          # GitHub release downloads (where Gradle now lives) can be slow; give the Gradle download 5 minutes, not 10 seconds
          sed -i 's/^networkTimeout=.*/networkTimeout=300000/' android/gradle/wrapper/gradle-wrapper.properties
          grep networkTimeout android/gradle/wrapper/gradle-wrapper.properties
          # Play Store rule: new apps and updates must target Android 16 (API 36). Fail the build if the project targets less.
          cat android/variables.gradle
          grep -Eq 'targetSdkVersion *= *(3[6-9]|[4-9][0-9])' android/variables.gradle
          # Ads (F3b): app ID and delayed measurement into the manifest, exact Google library versions into variables.gradle.
          # The script fails the step if anything did not apply.
          sh scripts/android-ads.sh android
          # D2 (DP-D15): the Play review library pinned to 2.0.2, SCHEDULE_EXACT_ALARM removed from the app's manifest and the
          # reminder's small notification icon in res/drawable. The script fails the step if anything did not apply.
          sh scripts/android-d2.sh android
          cat android/app/src/main/AndroidManifest.xml android/variables.gradle

      # Gradle distributions live on GitHub releases. Unsigned downloads can fail (GitHub incident, 2026-11-08),
      # so fetch it signed in with the build's own token, check Gradle's published SHA-256, and point the wrapper at the local file.
      - name: Get Gradle (signed-in download, checksum checked)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          P=android/gradle/wrapper/gradle-wrapper.properties
          ZIP=$(basename "$(sed -n 's/^distributionUrl=//p' $P | sed 's/\\:/:/g')")
          VER=$(echo "$ZIP" | sed -E 's/^gradle-(.+)-(all|bin)\.zip$/\1/')
          SUM=$(curl -fsSL --retry 5 "https://services.gradle.org/distributions/$ZIP.sha256")
          for i in 1 2 3 4 5; do
            gh release download "v$VER" -R gradle/gradle-distributions -p "$ZIP" -D "$RUNNER_TEMP" --clobber && break
            sleep 20
          done
          echo "$SUM  $RUNNER_TEMP/$ZIP" | sha256sum -c -
          sed -i "s#^distributionUrl=.*#distributionUrl=file://$RUNNER_TEMP/$ZIP#" $P
          echo "distributionSha256Sum=$SUM" >> $P
          cat $P

      - name: App icon and splash screen
        run: npx capacitor-assets generate --android --iconBackgroundColor '#cdb6ee' --splashBackgroundColor '#f4f1ea'
        continue-on-error: true

      - name: Copy the web app into Android
        run: |
          set -o pipefail
          NO_COLOR=1 npx cap sync android | tee "$RUNNER_TEMP/sync.txt" # no colour codes inside the version the grep below looks for
          # G2c: without the App plugin in the Android project the back button would leave the app again. Fail if it is missing.
          grep -qF '@capacitor/app@8.1.2' "$RUNNER_TEMP/sync.txt" || { echo "::error::cap sync did not list @capacitor/app@8.1.2"; exit 1; }
          grep -qF "include ':capacitor-app'" android/capacitor.settings.gradle || { echo "::error::android/capacitor.settings.gradle does not include @capacitor/app"; exit 1; }
          # D2: the reminder and rating plugins must be in the Android project, at the pinned versions
          for P in '@capacitor/local-notifications@8.3.1' '@capacitor-community/in-app-review@8.0.0'; do
            grep -qF "$P" "$RUNNER_TEMP/sync.txt" || { echo "::error::cap sync did not list $P"; exit 1; }
          done
          grep -qF "include ':capacitor-local-notifications'" android/capacitor.settings.gradle || { echo "::error::android/capacitor.settings.gradle does not include @capacitor/local-notifications"; exit 1; }
          grep -qF "include ':capacitor-community-in-app-review'" android/capacitor.settings.gradle || { echo "::error::android/capacitor.settings.gradle does not include @capacitor-community/in-app-review"; exit 1; }

      - name: Build the APK (and Play Store bundle when signed)
        env:
          KS_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          cd android
          chmod +x gradlew
          echo "apply from: '../../android-signing.gradle'" >> app/build.gradle
          # Ads (F3b): the build must link exactly the pinned libraries (scripts/android-ads.sh). Fail if Gradle resolved anything else.
          ./gradlew -q :app:dependencies --configuration releaseRuntimeClasspath --no-daemon > "$RUNNER_TEMP/deps.txt"
          # D2 (DP-D14, DP-D15): and the Play review library, exactly 2.0.2 (scripts/android-d2.sh).
          grep -E 'play-services-ads:|user-messaging-platform:|webview-native-ui:engine:|com\.google\.android\.play:' "$RUNNER_TEMP/deps.txt" | sort -u
          for D in 'com.google.android.gms:play-services-ads:25.4.0' 'com.google.android.ump:user-messaging-platform:4.0.0' 'io.github.webview-native-ui:engine:1.0.11' 'com.google.android.play:review:2.0.2'; do
            grep -qE -- "--- $D( \(\*\)| \(c\))?\$" "$RUNNER_TEMP/deps.txt" || { echo "::error::Gradle did not resolve exactly $D"; exit 1; }
          done
          if grep -E -- '--- (com\.google\.android\.gms:play-services-ads|com\.google\.android\.ump:user-messaging-platform|io\.github\.webview-native-ui:engine):.* -> ' "$RUNNER_TEMP/deps.txt"; then echo "::error::An ads library version was changed during resolution"; exit 1; fi
          if grep -E -- '--- com\.google\.android\.play:review:.* -> ' "$RUNNER_TEMP/deps.txt"; then echo "::error::The Play review library version was changed during resolution"; exit 1; fi
          if [ -n "$KS_PASS" ]; then
            echo "$KS_B64" | base64 -d > "$KS_PATH"
            ./gradlew assembleRelease bundleRelease --no-daemon
            cp app/build/outputs/apk/release/app-release.apk ../chess-coach-$VNAME.apk
            cp app/build/outputs/bundle/release/app-release.aab ../chess-coach-$VNAME.aab
          else
            echo "::warning::Signing secrets not set, building an unsigned debug APK (it will not update in place)"
            ./gradlew assembleDebug --no-daemon
            cp app/build/outputs/apk/debug/app-debug.apk ../chess-coach-$VNAME.apk
          fi

      # D2 (DP-D15): the manifest Gradle merged from the app and all libraries: no SCHEDULE_EXACT_ALARM, POST_NOTIFICATIONS there.
      - name: Check the merged manifest (no exact alarms)
        run: sh scripts/android-d2.sh --check-merged android

      - uses: actions/upload-artifact@v4
        with:
          name: chess-coach-${{ env.VNAME }}
          path: chess-coach-${{ env.VNAME }}.*

      - name: Publish as a GitHub Release (easy phone download)
        if: github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ env.VNAME }}
          name: Chess Coach ${{ env.VNAME }}
          body: |
            On your phone, tap the .apk below to install or update.
            The .aab file is for the Google Play Store.
          files: chess-coach-${{ env.VNAME }}.*
