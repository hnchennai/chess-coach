name: Build Android app

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

env:
  KS_PASS: ${{ secrets.ANDROID_KEY_PASSWORD }}
  KS_PATH: ${{ github.workspace }}/release.jks
  VCODE: ${{ github.run_number }}
  VNAME: 1.0.${{ github.run_number }}

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Use the Android SDK already on the runner
        run: |
          echo "ANDROID_HOME=$ANDROID_SDK_ROOT" >> $GITHUB_ENV
          yes | "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true

      - name: Install Capacitor
        run: npm install

      - name: Create the Android project
        run: |
          npx cap add android
          # GitHub release downloads (where Gradle now lives) can be slow; give the Gradle download 5 minutes, not 10 seconds
          sed -i 's/^networkTimeout=.*/networkTimeout=300000/' android/gradle/wrapper/gradle-wrapper.properties
          grep networkTimeout android/gradle/wrapper/gradle-wrapper.properties
          # Play Store rule: new apps and updates must target Android 16 (API 36). Fail the build if the project targets less.
          cat android/variables.gradle
          grep -Eq 'targetSdkVersion *= *(3[6-9]|[4-9][0-9])' android/variables.gradle

      # Gradle distributions live on GitHub releases. Unsigned downloads can fail (GitHub incident, 2026-11-08),
      # so fetch it signed in with the build's own token, check Gradle's published SHA-256, and point the wrapper at the local file.
      - name: Get Gradle (signed-in download, checksum checked)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          P=android/gradle/wrapper/gradle-wrapper.properties
          ZIP=$(basename "$(sed -n 's/^distributionUrl=//p' $P | sed 's/\\:/:/g')")
          VER=$(echo "$ZIP" | sed -E 's/^gradle-(.+)-(all|bin)\.zip$/\1/')
          SUM=$(curl -fsSL --retry 5 "https://services.gradle.org/distributions/$ZIP.sha256")
          for i in 1 2 3 4 5; do
            gh release download "v$VER" -R gradle/gradle-distributions -p "$ZIP" -D "$RUNNER_TEMP" --clobber && break
            sleep 20
          done
          echo "$SUM  $RUNNER_TEMP/$ZIP" | sha256sum -c -
          sed -i "s#^distributionUrl=.*#distributionUrl=file://$RUNNER_TEMP/$ZIP#" $P
          echo "distributionSha256Sum=$SUM" >> $P
          cat $P

      - name: App icon and splash screen
        run: npx capacitor-assets generate --android --iconBackgroundColor '#cdb6ee' --splashBackgroundColor '#f4f1ea'
        continue-on-error: true

      - name: Copy the web app into Android
        run: npx cap sync android

      - name: Build the APK (and Play Store bundle when signed)
        env:
          KS_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          cd android
          chmod +x gradlew
          echo "apply from: '../../android-signing.gradle'" >> app/build.gradle
          if [ -n "$KS_PASS" ]; then
            echo "$KS_B64" | base64 -d > "$KS_PATH"
            ./gradlew assembleRelease bundleRelease --no-daemon
            cp app/build/outputs/apk/release/app-release.apk ../chess-coach-$VNAME.apk
            cp app/build/outputs/bundle/release/app-release.aab ../chess-coach-$VNAME.aab
          else
            echo "::warning::Signing secrets not set, building an unsigned debug APK (it will not update in place)"
            ./gradlew assembleDebug --no-daemon
            cp app/build/outputs/apk/debug/app-debug.apk ../chess-coach-$VNAME.apk
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: chess-coach-${{ env.VNAME }}
          path: chess-coach-${{ env.VNAME }}.*

      - name: Publish as a GitHub Release (easy phone download)
        if: github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ env.VNAME }}
          name: Chess Coach ${{ env.VNAME }}
          body: |
            On your phone, tap the .apk below to install or update.
            The .aab file is for the Google Play Store.
          files: chess-coach-${{ env.VNAME }}.*
