<title>Suresh's Chess Coach</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bodoni+Moda:opsz,wght@6..96,500;6..96,700&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&family=Noto+Sans+Symbols+2&display=swap">
<style>
/* Layout: board-first two-column study table; coach panel to the right, stacks under the board on phones */
:root {
  --bg: #ECEFED; --surface: #FFFFFF; --ink: #1C2421; --muted: #5B6662; --line: #D3DAD6;
  --accent: #1E6B58; --accent-ink: #FFFFFF; --accent-soft: #D9EAE4;
  --sq-light: #EAD6B2; --sq-dark: #AE7D53; --coord-light: #8A6240; --coord-dark: #F3E4C8;
  --last: rgba(246, 205, 72, .55); --sel: rgba(30, 107, 88, .55); --dot: rgba(24, 32, 28, .28);
  --c-best: #17876B; --c-good: #4A8A35; --c-inacc: #B98A10; --c-mist: #D06A16; --c-blund: #C2352B;
  --eval-w: #F4F2EC; --eval-b: #2A302D;
  --f-display: 'Bodoni Moda', 'Didot', Georgia, serif;
  --f-body: 'IBM Plex Sans', system-ui, -apple-system, 'Segoe UI', sans-serif;
  --f-mono: 'IBM Plex Mono', ui-monospace, 'SFMono-Regular', Menlo, monospace;
  --f-piece: 'Noto Sans Symbols 2', 'Segoe UI Symbol', 'DejaVu Sans', 'Apple Symbols', sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #121714; --surface: #1A211E; --ink: #E4EBE7; --muted: #98A49F; --line: #2B3531;
    --accent: #55C2A2; --accent-ink: #0E1A16; --accent-soft: #1F3A32;
    --sq-light: #D2BD98; --sq-dark: #94673F; --coord-light: #7A5434; --coord-dark: #EEDDBE;
    --last: rgba(246, 205, 72, .5); --sel: rgba(85, 194, 162, .55); --dot: rgba(18, 24, 21, .35);
    --c-best: #3FC59F; --c-good: #86C46A; --c-inacc: #E3B53A; --c-mist: #F08A3A; --c-blund: #F0625A;
    --eval-w: #E8E5DD; --eval-b: #0B0E0D;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #121714; --surface: #1A211E; --ink: #E4EBE7; --muted: #98A49F; --line: #2B3531;
  --accent: #55C2A2; --accent-ink: #0E1A16; --accent-soft: #1F3A32;
  --sq-light: #D2BD98; --sq-dark: #94673F; --coord-light: #7A5434; --coord-dark: #EEDDBE;
  --last: rgba(246, 205, 72, .5); --sel: rgba(85, 194, 162, .55); --dot: rgba(18, 24, 21, .35);
  --c-best: #3FC59F; --c-good: #86C46A; --c-inacc: #E3B53A; --c-mist: #F08A3A; --c-blund: #F0625A;
  --eval-w: #E8E5DD; --eval-b: #0B0E0D;
  color-scheme: dark;
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
body { background: var(--bg); color: var(--ink); font-family: var(--f-body); font-size: 15px; line-height: 1.5; }
.wrap { max-width: 1060px; margin: 0 auto; padding-inline: 16px; padding-block: 20px 40px; }
header { display: flex; flex-wrap: wrap; align-items: baseline; gap: 4px 16px; margin-bottom: 18px; }
h1 { font-family: var(--f-display); font-weight: 700; font-size: clamp(26px, 4vw, 36px); margin: 0; letter-spacing: -.01em; text-wrap: balance; }
header p { margin: 0; color: var(--muted); }

.app { display: grid; grid-template-columns: minmax(0, 600px) minmax(0, 1fr); gap: 28px; align-items: start; }
@media (max-width: 860px) { .app { grid-template-columns: minmax(0, 1fr); gap: 18px; } }

/* board column */
.boardcol { display: flex; flex-direction: column; gap: 8px; min-width: 0; }
.player { display: flex; align-items: center; justify-content: space-between; gap: 10px; min-height: 30px; }
.who { font-weight: 600; display: flex; align-items: center; gap: 8px; }
.who .tag { font-family: var(--f-mono); font-size: 12px; font-weight: 500; color: var(--muted); }
.who .swatch { width: 14px; height: 14px; border-radius: 3px; border: 1px solid var(--line); }
.caps { font-family: var(--f-piece); font-size: 18px; color: var(--muted); letter-spacing: -2px; display: flex; align-items: center; gap: 6px; min-width: 0; overflow: hidden; }
.caps .adv { font-family: var(--f-mono); font-size: 12px; letter-spacing: 0; color: var(--ink); }
.thinking { font-family: var(--f-mono); font-size: 12px; color: var(--accent); }

.boardrow { display: flex; gap: 8px; align-items: stretch; }
.evalbar { width: 14px; flex: none; border-radius: 4px; background: var(--eval-b); position: relative; overflow: hidden; border: 1px solid var(--line); }
.evalbar .fill { position: absolute; left: 0; right: 0; bottom: 0; height: 50%; background: var(--eval-w); transition: height .5s ease; }
.evalbar.flip .fill { bottom: auto; top: 0; }
.evalnum { position: absolute; left: 0; right: 0; text-align: center; font-family: var(--f-mono); font-size: 8px; font-weight: 500; bottom: 3px; color: var(--eval-b); z-index: 1; writing-mode: vertical-rl; transform: rotate(180deg); }

.board { flex: 1; min-width: 0; aspect-ratio: 1 / 1; max-width: 100%; position: relative; container-type: inline-size; border-radius: 6px; overflow: hidden; box-shadow: 0 1px 0 rgba(0,0,0,.08), 0 10px 30px -12px rgba(30, 20, 10, .45); touch-action: none; user-select: none; -webkit-user-select: none; }
.grid { position: absolute; inset: 0; display: grid; grid-template-columns: repeat(8, 1fr); grid-template-rows: repeat(8, 1fr); }
.sq { position: relative; display: flex; align-items: center; justify-content: center; cursor: pointer; }
.sq.l { background: var(--sq-light); }
.sq.d { background: var(--sq-dark); }
.sq.last::before, .sq.sel::before, .sq.check::before { content: ""; position: absolute; inset: 0; }
.sq.last::before { background: var(--last); }
.sq.sel::before { background: var(--sel); }
.sq.check::before { background: radial-gradient(circle, rgba(220, 40, 30, .85) 0%, rgba(220, 40, 30, .35) 45%, transparent 72%); }
.sq.tgt::after { content: ""; position: absolute; width: 30%; height: 30%; border-radius: 50%; background: var(--dot); pointer-events: none; }
.sq.tgt.cap::after { width: 86%; height: 86%; background: transparent; border: .8cqw solid var(--dot); box-sizing: border-box; }
.sq:focus-visible { outline: 3px solid var(--accent); outline-offset: -3px; z-index: 2; }
.pc { position: relative; z-index: 1; font-family: var(--f-piece); font-size: 10.4cqw; line-height: 1; pointer-events: none; transform: translateY(-2%); }
.pc.w { color: #FBF8F1; text-shadow: 0 0 1px #1a1410, .9px .9px 0 #1a1410, -.9px -.9px 0 #1a1410, .9px -.9px 0 #1a1410, -.9px .9px 0 #1a1410, 0 2px 3px rgba(0,0,0,.35); }
.pc.b { color: #1E1915; text-shadow: 0 0 1px #000, 0 1px 0 rgba(255,255,255,.18), 0 2px 3px rgba(0,0,0,.3); }
.pc.drag { opacity: .25; }
.coord { position: absolute; font-family: var(--f-mono); font-weight: 500; font-size: 2.1cqw; line-height: 1; pointer-events: none; }
.coord.r { top: 4%; left: 5%; } .coord.f { bottom: 4%; right: 6%; }
.sq.l .coord { color: var(--coord-light); } .sq.d .coord { color: var(--coord-dark); }
.arrow { position: absolute; inset: 0; pointer-events: none; z-index: 3; }
.ghost { position: fixed; z-index: 50; pointer-events: none; font-family: var(--f-piece); line-height: 1; transform: translate(-50%, -55%); }
.banner { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; z-index: 4; background: rgba(10, 14, 12, .45); }
.banner div { background: var(--surface); color: var(--ink); padding: 16px 22px; border-radius: 10px; text-align: center; box-shadow: 0 10px 30px rgba(0,0,0,.3); max-width: 80%; }
.banner b { font-family: var(--f-display); font-size: 24px; display: block; }

.controls { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 6px; }
button, select { font: inherit; font-size: 14px; }
.btn { appearance: none; border: 1px solid var(--line); background: var(--surface); color: var(--ink); padding: 8px 14px; border-radius: 8px; cursor: pointer; font-weight: 500; }
.btn:hover:not(:disabled) { border-color: var(--muted); }
.btn:disabled { opacity: .45; cursor: default; }
.btn.primary { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
.btn:focus-visible, select:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
.sync { margin: 2px 0 0; font-size: 13px; color: var(--muted); display: flex; align-items: center; gap: 8px; }
.sync::before { content: ""; width: 8px; height: 8px; border-radius: 50%; background: var(--c-inacc); flex: none; }
.sync.ok::before { background: var(--c-best); }
.btn .k { font-family: var(--f-mono); font-size: 11px; opacity: .6; margin-left: 4px; }

/* side panel */
.side { display: flex; flex-direction: column; gap: 16px; min-width: 0; }
.coach { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 18px 18px 16px; }
.eyebrow { font-size: 11px; font-weight: 600; letter-spacing: .09em; text-transform: uppercase; color: var(--muted); margin: 0 0 8px; }
.verdict { display: flex; align-items: center; gap: 12px; margin-bottom: 8px; }
.sym { font-family: var(--f-display); font-weight: 700; font-size: 30px; line-height: 1; min-width: 44px; height: 44px; display: grid; place-items: center; border-radius: 10px; color: #fff; background: var(--accent); }
.verdict h2 { font-family: var(--f-display); font-weight: 700; font-size: 22px; margin: 0; line-height: 1.15; }
.verdict .mv { font-family: var(--f-mono); font-size: 13px; color: var(--muted); }
.coach p { margin: 6px 0 0; }
.coach .tip { margin-top: 12px; padding: 10px 12px; border-radius: 8px; background: var(--accent-soft); font-size: 14px; }
.coach .tip b { font-weight: 600; }
.mono { font-family: var(--f-mono); font-size: .93em; }
.v-best .sym { background: var(--c-best); } .v-good .sym { background: var(--c-good); }
.v-inacc .sym { background: var(--c-inacc); } .v-mist .sym { background: var(--c-mist); } .v-blund .sym { background: var(--c-blund); }
.v-info .sym { background: var(--accent); color: var(--accent-ink); font-size: 24px; }

.card { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 14px 16px; }
.checks { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px; }
.chk { display: flex; align-items: center; gap: 8px; font-size: 14px; color: var(--muted); }
.chk i { width: 18px; height: 18px; border-radius: 50%; border: 1.5px solid var(--line); flex: none; display: grid; place-items: center; font-style: normal; font-size: 11px; }
.chk.on { color: var(--ink); } .chk.on i { background: var(--c-best); border-color: var(--c-best); color: #fff; }

.settings { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; align-items: end; }
.settings label { display: flex; flex-direction: column; gap: 4px; font-size: 12px; color: var(--muted); font-weight: 500; }
select { width: 100%; padding: 8px 10px; border-radius: 8px; border: 1px solid var(--line); background: var(--surface); color: var(--ink); }
.settings .btn { grid-column: 1 / -1; }

.moves { max-height: 240px; overflow-y: auto; font-family: var(--f-mono); font-size: 13px; font-variant-numeric: tabular-nums; }
.moves table { width: 100%; border-collapse: collapse; }
.moves td { padding: 3px 6px; white-space: nowrap; }
.moves td.n { color: var(--muted); width: 2.5em; }
.moves tr:nth-child(odd) td { background: color-mix(in srgb, var(--bg) 55%, transparent); }
.moves .s { font-weight: 500; margin-left: 2px; }
.s.best { color: var(--c-best); } .s.good { color: var(--c-good); } .s.inacc { color: var(--c-inacc); } .s.mist { color: var(--c-mist); } .s.blund { color: var(--c-blund); }
.empty { color: var(--muted); font-family: var(--f-body); font-size: 14px; }
.legend { display: flex; flex-wrap: wrap; gap: 4px 12px; margin-top: 10px; font-size: 12px; color: var(--muted); }
.legend span b { font-family: var(--f-display); margin-right: 3px; }

/* ---- v3: tabs, opponent card, CCT, train, learn, progress ---- */
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
.btn.sm { padding: 5px 10px; font-size: 13px; }
.tabs { display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 4px; padding: 4px; background: var(--surface); border: 1px solid var(--line); border-radius: 10px; }
.tab { appearance: none; border: 0; background: transparent; color: var(--muted); font: inherit; font-size: 14px; font-weight: 600; padding: 8px 4px; border-radius: 7px; cursor: pointer; }
.tab[aria-selected="true"] { background: var(--accent); color: var(--accent-ink); }
.tab:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
.panel { display: flex; flex-direction: column; gap: 14px; }
.card.opp { border-left: 0; }
.why { margin: 0; padding-left: 18px; display: flex; flex-direction: column; gap: 6px; }
.why li { padding-left: 2px; }
.why li.threat::marker { color: var(--c-blund); }
.why li.good::marker { color: var(--c-best); }
.cct { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; margin-bottom: 10px; }
.cct div { border: 1px solid var(--line); border-radius: 8px; padding: 8px 10px; }
.cct b { display: block; font-family: var(--f-display); font-size: 24px; line-height: 1.1; font-variant-numeric: tabular-nums; }
.cct span { font-size: 12px; color: var(--muted); }
.cct .warn { border-color: var(--c-blund); }
.cct .warn b { color: var(--c-blund); }
.plan p { margin: 0 0 6px; }
.plan ul { margin: 4px 0 0; padding-left: 18px; display: flex; flex-direction: column; gap: 4px; }
.phase { display: inline-block; font-size: 11px; font-weight: 600; letter-spacing: .08em; text-transform: uppercase; color: var(--accent); margin-right: 6px; }
.chips { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 10px; }
.chip { appearance: none; border: 1px solid var(--line); background: var(--bg); color: var(--ink); font: inherit; font-size: 13px; padding: 5px 10px; border-radius: 999px; cursor: pointer; }
.chip:hover { border-color: var(--accent); }
.chip:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
.askform { display: flex; gap: 8px; }
.askform input { flex: 1; min-width: 0; font: inherit; font-size: 14px; padding: 8px 10px; border-radius: 8px; border: 1px solid var(--line); background: var(--surface); color: var(--ink); }
.askform input:focus-visible { outline: 3px solid var(--accent); outline-offset: 1px; }
.answer { margin-top: 12px; padding: 12px 14px; border-radius: 8px; background: var(--accent-soft); font-size: 14px; }
.answer p { margin: 0 0 8px; } .answer p:last-child { margin-bottom: 0; }
.answer ul { margin: 0 0 8px; padding-left: 18px; }
.note { margin: 10px 0 0; font-size: 13px; color: var(--c-mist); }
.lede { margin: 0 0 12px; color: var(--muted); font-size: 14px; }
.puzlist { display: flex; flex-direction: column; gap: 14px; }
.puzgroup h3 { margin: 0 0 6px; font-size: 13px; font-weight: 600; }
.puzrow { display: flex; flex-wrap: wrap; gap: 6px; }
.puz { appearance: none; display: inline-flex; align-items: center; gap: 6px; border: 1px solid var(--line); background: var(--surface); color: var(--ink); font: inherit; font-size: 13px; padding: 6px 10px; border-radius: 8px; cursor: pointer; }
.puz:hover { border-color: var(--accent); }
.puz.done { border-color: var(--c-best); }
.puz.done::before { content: "\2713"; color: var(--c-best); font-weight: 700; }
.puz.on { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
.puz:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
.coachline p { margin: 0; }
.coachline.ok { border-color: var(--c-best); }
.coachline.no { border-color: var(--c-mist); }
.lessons { display: flex; flex-direction: column; gap: 10px; }
.lesson { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; }
.lesson summary { cursor: pointer; padding: 14px 16px; list-style: none; display: flex; align-items: baseline; gap: 10px; }
.lesson summary::-webkit-details-marker { display: none; }
.lesson summary::after { content: "+"; margin-left: auto; color: var(--muted); font-size: 18px; }
.lesson[open] summary::after { content: "\2212"; }
.lesson summary h3 { margin: 0; font-family: var(--f-display); font-size: 19px; font-weight: 700; }
.lesson summary span { color: var(--muted); font-size: 13px; }
.lesson .body { padding: 0 16px 14px; }
.lesson .body ul { margin: 0 0 10px; padding-left: 18px; display: flex; flex-direction: column; gap: 5px; }
.lesson .body p { margin: 0 0 8px; }
.stats { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 8px; }
.stats div { border: 1px solid var(--line); border-radius: 8px; padding: 8px 10px; }
.stats b { display: block; font-family: var(--f-display); font-size: 24px; line-height: 1.1; font-variant-numeric: tabular-nums; }
.stats span { font-size: 12px; color: var(--muted); }
@media (max-width: 420px) { .stats { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
.focus { border-color: var(--accent); }
.focus h3 { margin: 0 0 4px; font-family: var(--f-display); font-size: 20px; }
.focus p { margin: 0 0 6px; }
.bars { display: flex; flex-direction: column; gap: 6px; margin-top: 10px; }
.bar { display: grid; grid-template-columns: 9.5em minmax(0, 1fr) 2em; gap: 8px; align-items: center; font-size: 13px; }
.bar i { display: block; height: 8px; border-radius: 4px; background: var(--c-mist); min-width: 2px; }
.bar em { font-style: normal; color: var(--muted); font-variant-numeric: tabular-nums; text-align: right; }
.hist { display: flex; flex-direction: column; }
.hrow { display: grid; grid-template-columns: 4.2em minmax(0, 1fr) auto; gap: 10px; align-items: center; padding: 8px 0; border-top: 1px solid var(--line); font-size: 14px; }
.hrow:first-child { border-top: 0; }
.res { font-weight: 600; font-size: 12px; text-align: center; padding: 3px 0; border-radius: 6px; color: #fff; }
.res.W { background: var(--c-best); } .res.L { background: var(--c-blund); } .res.D { background: var(--muted); }
.hrow small { color: var(--muted); display: block; font-size: 12px; }
.modebar { display: flex; align-items: center; justify-content: space-between; gap: 10px; padding: 8px 10px; border-radius: 10px; background: var(--accent-soft); }
.modeinfo { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; font-size: 14px; min-width: 0; }
.modetag { font-size: 11px; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; color: var(--accent); }
.navpos { font-family: var(--f-mono); font-size: 13px; color: var(--muted); align-self: center; padding: 0 4px; }
.sq.hl::before { content: ""; position: absolute; inset: 0; box-shadow: inset 0 0 0 4px var(--accent); background: rgba(30, 107, 88, .18); }
.moves td.cur { outline: 2px solid var(--accent); outline-offset: -2px; border-radius: 4px; }
.moves td.clk { cursor: pointer; }
.banner .btn { margin-top: 10px; }
.empty-note { color: var(--muted); font-size: 14px; margin: 0; }

/* ---- v4: course ---- */
.board.nocoord .coord { display: none; }
.sq.ok::before { content: ""; position: absolute; inset: 0; background: rgba(23, 135, 107, .55); }
header { justify-content: space-between; align-items: center; }
.engine-pill { display: inline-flex; align-items: center; gap: 8px; margin: 0; padding: 4px 10px; border-radius: 999px; border: 1px solid var(--line); background: var(--surface); font-size: 12px; color: var(--muted); }
.engine-pill i { width: 8px; height: 8px; border-radius: 50%; background: var(--c-inacc); }
.engine-pill.ok i { background: var(--c-best); }
.engine-pill.ok { color: var(--ink); }
.today h3 { margin: 0 0 2px; font-family: var(--f-display); font-size: 22px; }
.today .sub { margin: 0 0 12px; color: var(--muted); font-size: 13px; }
.tasks { display: flex; flex-direction: column; gap: 8px; }
.task { display: grid; grid-template-columns: 26px minmax(0, 1fr) auto; gap: 10px; align-items: center; padding: 10px 12px; border: 1px solid var(--line); border-radius: 10px; background: var(--surface); }
.task .ck { width: 22px; height: 22px; border-radius: 50%; border: 2px solid var(--line); display: grid; place-items: center; font-size: 12px; color: #fff; }
.task.done .ck { background: var(--c-best); border-color: var(--c-best); }
.task.done .tt { color: var(--muted); text-decoration: line-through; }
.task .tt { font-weight: 500; font-size: 14px; }
.task small { display: block; color: var(--muted); font-size: 12px; font-weight: 400; text-decoration: none; }
.streak { display: flex; gap: 14px; margin-top: 12px; font-size: 13px; color: var(--muted); flex-wrap: wrap; }
.streak b { color: var(--ink); font-variant-numeric: tabular-nums; }
.lvl { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; margin-top: 14px; }
.lvl > summary { list-style: none; cursor: pointer; padding: 14px 16px; display: grid; grid-template-columns: 34px minmax(0, 1fr) auto; gap: 12px; align-items: center; }
.lvl > summary::-webkit-details-marker { display: none; }
.lvnum { width: 34px; height: 34px; border-radius: 50%; display: grid; place-items: center; font-family: var(--f-display); font-weight: 700; font-size: 17px; background: var(--accent-soft); color: var(--accent); }
